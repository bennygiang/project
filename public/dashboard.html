<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SpotiSeek</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>SpotiSeek Dashboard</h1>
            </div>
            <div class="user-info">
                <span id="user-name">Loading...</span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="dashboard-grid">
                <!-- Spotify Playlists Section -->
                <div class="section">
                    <div class="section-header">
                        <h2><i class="fab fa-spotify"></i> Your Spotify Playlists</h2>
                        <button class="refresh-btn" onclick="loadPlaylists()">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                    <div class="playlists-container">
                        <div id="playlists-loading" class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            Loading playlists...
                        </div>
                        <div id="playlists-list" class="playlists-list"></div>
                    </div>
                </div>

                <!-- Tracked Playlists Section -->
                <div class="section">
                    <div class="section-header">
                        <h2><i class="fas fa-list"></i> Tracked Playlists</h2>
                        <span class="track-count" id="tracked-count">0 playlists</span>
                    </div>
                    <div id="tracked-playlists" class="tracked-playlists"></div>
                </div>

                <!-- Download History Section -->
                <div class="section full-width">
                    <div class="section-header">
                        <h2><i class="fas fa-download"></i> Download History</h2>
                        <div class="download-stats">
                            <span id="success-count" class="stat success">0 successful</span>
                            <span id="failed-count" class="stat failed">0 failed</span>
                        </div>
                    </div>
                    <div id="download-history" class="download-history"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for playlist details -->
    <div id="playlist-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Playlist Details</h3>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="modal-content"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="track-playlist-btn" onclick="trackPlaylist()">
                    <i class="fas fa-plus"></i>
                    Track Playlist
                </button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
